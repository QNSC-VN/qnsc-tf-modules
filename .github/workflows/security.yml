# =============================================================================
# Security · Scan — IaC misconfig + committed-secret gate for the modules.
#
# The shared QNSC-VN/qnsc-ci security suite is app/container oriented (Semgrep
# TS/Node packs, Trivy image CVEs) and is the wrong tool for pure OpenTofu, so
# this repo runs the IaC-native pair instead (same shape as qnsc-infra):
#   • Checkov  — Terraform/OpenTofu misconfig scan over modules/. ENFORCED
#                against a baseline (fails CI on NEW misconfigurations only).
#   • Gitleaks — committed-secret scan.
#
# Lives in its own workflow (not ci.yml) so security is independently runnable
# and runs weekly — matching the org convention used by every other repo.
# =============================================================================
name: Security · Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # weekly Monday 04:00 UTC — catch new rules/CVEs between pushes

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checkov:
    name: checkov (IaC misconfig)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Checkov scan
        uses: bridgecrewio/checkov-action@7b972723c44fb3d256283fac96fae5d7c1894bb7 # v12.3114.0
        with:
          directory: modules/
          framework: terraform
          quiet: true
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          # ENFORCED against a baseline: fails CI on NEW misconfigurations only.
          # The pre-existing findings are recorded in modules/.checkov.baseline
          # (burn them down over time; regenerate with --create-baseline).
          soft_fail: false
          baseline: modules/.checkov.baseline

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          sarif_file: checkov.sarif
        continue-on-error: true

  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: QNSC-VN/qnsc-ci/actions/scan-secrets@v1.4.0
