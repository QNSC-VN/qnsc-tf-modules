# =============================================================================
# Release — thin caller of the shared reusable (qnsc-ci). Runs release-please
# in MANIFEST / multi-component mode: each modules/<name> directory is versioned
# independently and tagged as `<name>-vX.Y.Z` (e.g. ecr-v1.1.0), matching how
# consumers pin `?ref=<name>-vX.Y.Z`. Before this, those tags were cut by hand.
#
# Requires: RELEASE_BOT_APP_ID (org var) + RELEASE_BOT_PRIVATE_KEY (org secret).
# Both optional — the reusable falls back to github.token when unset (but then
# release tags won't trigger downstream workflows).
# =============================================================================
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    uses: QNSC-VN/qnsc-ci/.github/workflows/release-please.yml@v1.4.0
    with:
      manifest_file: .release-please-manifest.json
    secrets:
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
