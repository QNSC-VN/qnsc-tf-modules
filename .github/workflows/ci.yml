name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TOFU_VERSION: '1.9.1'

jobs:
  validate:
    name: fmt · validate · tflint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: opentofu/setup-opentofu@909f0081d9d7379c18f3cb2c598fca1c21d5b7c0 # v1.0.5
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: tofu fmt (check)
        run: tofu fmt -check -recursive

      # Validate each module independently. Modules have no backend, so
      # `tofu init -backend=false` is enough to resolve providers for validation.
      - name: tofu validate (per module)
        run: |
          set -euo pipefail
          for dir in modules/*/; do
            echo "── validating $dir ──"
            tofu -chdir="$dir" init -backend=false -input=false >/dev/null
            tofu -chdir="$dir" validate
          done

      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
        with:
          tflint_version: latest

      - name: tflint (per module)
        run: |
          set -euo pipefail
          tflint --init
          for dir in modules/*/; do
            echo "── tflint $dir ──"
            tflint --chdir="$dir"
          done
