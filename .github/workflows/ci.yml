name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TOFU_VERSION: '1.9.1'

jobs:
  validate:
    name: fmt · validate · tflint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: tofu fmt (check)
        run: tofu fmt -check -recursive

      # Validate each module independently. Modules have no backend, so
      # `tofu init -backend=false` is enough to resolve providers for validation.
      - name: tofu validate (per module)
        run: |
          set -euo pipefail
          for dir in modules/*/; do
            echo "── validating $dir ──"
            tofu -chdir="$dir" init -backend=false -input=false >/dev/null
            tofu -chdir="$dir" validate
          done

      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
        with:
          tflint_version: latest

      - name: tflint (per module)
        run: |
          set -euo pipefail
          tflint --init
          for dir in modules/*/; do
            echo "── tflint $dir ──"
            tflint --chdir="$dir"
          done

  checkov:
    name: checkov (security/misconfig)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkov scan
        uses: bridgecrewio/checkov-action@063da70420ab562cb31f661b374a76b6a42ed6b5 # v12.3108.0
        with:
          directory: modules/
          framework: terraform
          quiet: true
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          # ENFORCED against a baseline: fails CI on NEW misconfigurations only.
          # The 38 pre-existing findings are recorded in modules/.checkov.baseline
          # (burn them down over time; regenerate with --create-baseline).
          soft_fail: false
          baseline: modules/.checkov.baseline

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov.sarif
        continue-on-error: true
